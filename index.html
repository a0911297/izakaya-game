<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18284a">
<meta property="og:type" content="website">
<meta property="og:title" content="我的居酒屋｜台北居酒屋經營模擬">
<meta property="og:description" content="在台北開一間日式居酒屋：請人、定菜單、擺座位，挑戰提燈評鑑三盞燈。免費、瀏覽器直接玩。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>我的居酒屋</title>
<meta name="description" content="台北日式居酒屋經營模擬：請人、定菜單、擺座位，挑戰提燈評鑑三盞燈。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：上方藍染工具列；左邊是店內俯瞰畫面，右邊是出單板。手機時上下堆疊。
   刻意只做一套淺色紙面（遊戲畫面本身是夜晚的店），字一律用最深的墨色。 */
:root{
  --paper:#e9edf1;       /* 灰藍和紙底 */
  --panel:#ffffff;
  --ink:#0b111c;         /* 主要文字：最深墨色 */
  --ink-soft:#26303f;    /* 次要文字，仍然夠深 */
  --line:#b9c2cf;
  --ai:#18284a;          /* 藍染：工具列與暖簾 */
  --ai-ink:#f5f7fb;
  --shu:#b0241c;         /* 朱紅：主要按鈕、提燈 */
  --kin:#c4860f;         /* 提燈的琥珀光 */
  --ok:#17663e; --warn:#8f4f00; --bad:#a31f17;
  --chip:#dfe5ec;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;min-height:100%}
#top{background:var(--ai);color:var(--ai-ink);padding-block:8px;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
#brand{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:var(--ai-ink)}
#brand small{font-family:var(--f-body);font-size:14px;font-weight:700;letter-spacing:0;opacity:.95}
#stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;font-weight:700}
#stats span b{font-weight:900;font-size:17px}
#nav{background:#0f1a33;padding-block:6px;padding-inline:16px;display:flex;flex-wrap:wrap;gap:6px}
#nav button{background:transparent;border:1.5px solid #5d6f96;color:var(--ai-ink);border-radius:6px;padding:6px 12px;font-weight:700;font-size:15px}
#nav button:hover{background:#24365f}
#nav button[disabled]{opacity:.45;cursor:not-allowed}

#main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding-block:14px;padding-inline:16px;align-items:start}
@media (max-width:980px){#main{grid-template-columns:minmax(0,1fr)}}
#stageWrap{position:relative;min-width:0}
#cv{width:100%;height:auto;display:block;border-radius:8px;background:#1b1712;touch-action:manipulation}
#banner{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel);border:2px solid var(--ink);border-radius:7px;padding:8px 14px;font-weight:700;font-size:16px}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.primary:hover{background:#8e1c15}
.btn.small{padding:4px 10px;font-size:14px;border-width:1.5px}
.btn.on{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.notice{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:10px 14px;font-size:15px}
.notice.warn{border-color:var(--bad)}
.notice h4{margin:0 0 4px;font-size:16px}
.notice ul{margin:0;padding-left:20px}

#side{background:var(--panel);border:2px solid var(--ink);border-radius:8px;min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
@media (max-width:980px){#side{max-height:none}}
#tabs{display:flex;border-bottom:2px solid var(--ink)}
#tabs button{flex:1;background:none;border:0;padding:9px 4px;font-weight:700;font-size:15px;border-right:1.5px solid var(--line)}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--ai);color:var(--ai-ink)}
#sideBody{padding:10px 12px;overflow:auto;font-size:15px;display:flex;flex-direction:column;gap:8px}
.tk{border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px}
.tk.ready{border-color:var(--ok);background:#e8f4ec}
.tk.late{border-color:var(--bad);background:#fbeceb}
.tk .h{display:flex;justify-content:space-between;font-weight:900}
.sec{font-family:var(--f-disp);font-weight:900;font-size:17px;margin:4px 0 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pbar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%}
.log{font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:4px}
.muted{color:var(--ink-soft)}

#modal{position:fixed;inset:0;background:rgba(8,12,22,.6);display:flex;align-items:flex-start;justify-content:center;padding-block:24px;padding-inline:16px;overflow:auto;z-index:20}
.sheet{background:var(--panel);border-radius:10px;border:2px solid var(--ink);width:100%;max-width:880px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet header{background:var(--ai);color:var(--ai-ink);padding:12px 18px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header h2{margin:0;font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.04em;text-wrap:balance}
.sheet header button{background:none;border:1.5px solid #8c9cc0;color:var(--ai-ink);border-radius:6px;padding:4px 10px;font-weight:700}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .foot{padding:12px 18px;border-top:1.5px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.sel{outline:3px solid var(--shu);outline-offset:1px}
.card h3{margin:0;font-size:17px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:13.5px;font-weight:700}
.chip.k{background:#f6e2c0}
.chip.r{background:#f5d7d3}
.chip.g{background:#d5ecdd}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
table.t th{font-weight:900;background:var(--chip)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.stat{display:grid;grid-template-columns:44px 1fr 30px;gap:6px;align-items:center;font-size:14px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.quote{font-family:var(--f-disp);font-weight:700}
.big{font-family:var(--f-disp);font-weight:900;font-size:28px;letter-spacing:.04em}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700}
textarea.code{width:100%;font:13px/1.45 ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;color:var(--ink);background:#fff;word-break:break-all;resize:vertical}
label.f input[type=range]{padding:0;border:0;accent-color:var(--shu);height:28px}
label.f input:not([type=range]),label.f select{font:inherit;padding:8px 10px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
.opt{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;text-align:left;background:#fff}
.opt.sel{background:var(--ai);color:var(--ai-ink)}
.opt b{font-size:17px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.stars{color:var(--kin);letter-spacing:1px;font-size:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi div{border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.good{color:var(--ok)} .bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header id="top">
    <button id="brand" title="改店名">🏮 <span id="shopName">我的居酒屋</span> <small id="locName"></small></button>
    <div id="stats"></div>
  </header>
  <nav id="nav">
    <button data-nav="edit">🪑 擺設</button>
    <button data-nav="shop">🛒 商店</button>
    <button data-nav="staff">👥 員工</button>
    <button data-nav="menu">📜 菜單</button>
    <button data-nav="promo">📣 宣傳</button>
    <button data-nav="data">📊 店舖資料</button>
    <button data-nav="loan">🏦 借貸</button>
    <button data-nav="hours">🕔 營業時間</button>
    <button data-nav="help">❓ 說明</button>
    <button data-nav="transfer" data-owner hidden>📦 轉移存檔</button>
    <button data-nav="sound" data-owner hidden>🎵 音樂音效</button>

  <div id="main">
    <section id="stageWrap">
      <canvas id="cv"></canvas>
      <div id="banner"></div>
    </section>
    <aside id="side">
      <div id="tabs"></div>
      <div id="sideBody"></div>
    </aside>
  </div>
  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" hidden></div>
</div>

<script>
'use strict';
const APP_VER='2026-10-26c';
// 店主模式：網頁版（github.io）上只有輸入密碼的電腦看得到設定類選單；claude.ai 版一律視為店主
const ONLINE=/github\.io$/.test(location.hostname);
const OWNER_HASH='ed77e1a0f2358e25e8d7d31e7e7e33639d0a0468a3f62875b695d5e6438763a1';
function isOwner(){if(!ONLINE)return true;try{return localStorage.getItem('izakaya-owner')===OWNER_HASH}catch(e){return false}}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// ================= 工具 =================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('zh-TW');
const hhmm=m=>{const h=Math.floor(m/60)%24,mm=Math.floor(m%60);return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['日','一','二','三','四','五','六'];
function wpick(list,wf){let s=0;const w=list.map(x=>{const v=Math.max(0,wf(x));s+=v;return v});if(s<=0)return null;let r=Math.random()*s;for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1]}
const starStr=v=>{const f=Math.round(v*2)/2;let s='';for(let i=1;i<=5;i++)s+=f>=i?'★':(f>=i-.5?'⯪':'☆');return s};

// ================= 資料 =================

// curve：17,18,...,24,01 點各時段的人潮

  office:{label:'下班族',icon:'💼',color:'#2f5d9c',size:[2,4],pp:650,likes:['下酒','啤酒'],more:.72,maxR:4,pat:1,drink:1.15,w:{wait:1.2,food:.8,price:.9,svc:.8,env:.6},curve:[.5,1.1,1.3,1.1,.7,.4,.2,.1,.05],note:'下班後來喝一杯。喜歡下酒菜和啤酒、Highball，會一輪一輪追加，最怕等。'},

// p 售價, c 成本, t 調理分鐘, q 基本品質, L 需要幾盞燈
const MENU=[

const T=40,WALLPX=16,COLS=16,ROWS=9,STREET=118;
const CW=COLS*T+WALLPX*2,CH=WALLPX+ROWS*T+WALLPX+STREET;
const OX=WALLPX,OY=WALLPX;
const PX=x=>OX+x*T+T/2,PY=y=>OY+y*T+T/2;
const KIT={x:0,y:0,w:4,h:3},BAR={x:5,y:0,w:6,h:2},WC={x:14,y:0,w:2,h:2},REG={x:1,y:7};
const DOOR={x:8,y:8},KPICK={x:4,y:2},BPICK={x:11,y:1},REG_STAFF={x:1,y:6},REG_CUST={x:1,y:8};
const STOOLS=[5,6,7,8,9,10].map(x=>({x,y:2}));
const OUT_Y=9.75;
const inRect=(x,y,r)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
const fixedBlocked=(x,y)=>inRect(x,y,KIT)||inRect(x,y,BAR)||inRect(x,y,WC)||(x===REG.x&&y===REG.y);
const RESERVED=new Set([[DOOR.x,DOOR.y],[8,7],[KPICK.x,KPICK.y],[BPICK.x,BPICK.y],[REG_STAFF.x,REG_STAFF.y],[REG_CUST.x,REG_CUST.y],...STOOLS.map(s=>[s.x,s.y])].map(([x,y])=>y*COLS+x));
function footprint(o){const d=FURN[o.kind];const w=o.rot?d.h:d.w,h=o.rot?d.w:d.h;const a=[];for(let i=0;i<w;i++)for(let j=0;j<h;j++)a.push({x:o.x+i,y:o.y+j});return a}
function buildBlock(layout){const b=new Uint8Array(COLS*ROWS);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(fixedBlocked(x,y))b[y*COLS+x]=1;for(const o of layout)for(const t of footprint(o))if(t.x>=0&&t.y>=0&&t.x<COLS&&t.y<ROWS)b[t.y*COLS+t.x]=1;return b}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfsDist(b,sx,sy){const d=new Int16Array(COLS*ROWS).fill(-1);const q=[sy*COLS+sx];d[q[0]]=0;for(let i=0;i<q.length;i++){const k=q[i],x=k%COLS,y=(k/COLS)|0;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const nk=ny*COLS+nx;if(b[nk]||d[nk]>=0)continue;d[nk]=d[k]+1;q.push(nk)}}return d}
function validateLayout(layout){
  const seen=new Map();
  for(const o of layout){for(const t of footprint(o)){
    if(t.x<0||t.y<0||t.x>=COLS||t.y>=ROWS)return{ok:false,msg:'超出店面範圍'};
    const k=t.y*COLS+t.x;
    if(fixedBlocked(t.x,t.y))return{ok:false,msg:'不能放在廚房、吧台、廁所或收銀台上'};
    if(RESERVED.has(k))return{ok:false,msg:'這格要留給門口、出餐口、吧台座位或收銀台'};
    if(seen.has(k))return{ok:false,msg:'跟其他家具重疊'};
    seen.set(k,o);
  }}
  const b=buildBlock(layout),d=bfsDist(b,DOOR.x,DOOR.y);
  const need=[[KPICK,'廚房出餐口'],[BPICK,'吧台出酒口'],[REG_STAFF,'收銀台'],[REG_CUST,'收銀台前'],...STOOLS.map(s=>[s,'吧台座位'])];
  for(const[p,n]of need)if(d[p.y*COLS+p.x]<0)return{ok:false,msg:`走道被擋住，到不了${n}`};
  for(const o of layout){if(!FURN[o.kind].cap)continue;let okk=false;for(const t of footprint(o))for(const[dx,dy]of DIRS){const nx=t.x+dx,ny=t.y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;if(d[ny*COLS+nx]>=0)okk=true}if(!okk)return{ok:false,msg:`有一張${FURN[o.kind].label}走不到`}}
  return{ok:true}
}
let MAP=null;
function rebuildMap(){
  const b=buildBlock(g.layout),d=bfsDist(b,DOOR.x,DOOR.y);
  const tables=[];
  for(const o of g.layout){const f=FURN[o.kind];if(!f.cap)continue;const fp=footprint(o),fk=new Set(fp.map(t=>t.y*COLS+t.x));
    let best=null,bd=1e9;const pts=[];
    for(const t of fp)for(const[dx,dy]of DIRS){const nx=t.x+dx,ny=t.y+dy;if(fk.has(ny*COLS+nx))continue;pts.push({x:t.x+dx*.6,y:t.y+dy*.6});if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const dd=d[ny*COLS+nx];if(dd>=0&&dd<bd){bd=dd;best={x:nx,y:ny}}}
    const cx=fp.reduce((s,t)=>s+t.x,0)/fp.length,cy=fp.reduce((s,t)=>s+t.y,0)/fp.length;
    pts.sort((a,b2)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b2.y-cy,b2.x-cx));
    const seats=[];for(let i=0;i<f.cap;i++)seats.push(pts[Math.floor(i*pts.length/f.cap)%pts.length]);
    tables.push({uid:o.uid,kind:o.kind,cap:f.cap,fp,access:best||{x:DOOR.x,y:DOOR.y-1},seats,party:null,dirty:false,stool:false,cx,cy});
  }
  // 吧台座位：外場站在座位後面那一格點菜、送餐，不跟客人擠在同一格
  STOOLS.forEach((s,i)=>tables.push({uid:'s'+i,kind:'stool',cap:1,fp:[s],access:b[(s.y+1)*COLS+s.x]?{x:s.x,y:s.y}:{x:s.x,y:s.y+1},seats:[{x:s.x,y:s.y}],party:null,dirty:false,stool:true,idx:i,cx:s.x,cy:s.y}));
  for(const s of STOOLS)b[s.y*COLS+s.x]=1; // 吧台座位不當走道
  MAP={b,d,tables};
}
function bfsPath(sx,sy,tx,ty){
  const b=MAP.b;sx=clamp(sx,0,COLS-1);sy=clamp(sy,0,ROWS-1);
  if(sx===tx&&sy===ty)return[];
  const prev=new Int16Array(COLS*ROWS).fill(-2);const s=sy*COLS+sx,t=ty*COLS+tx;prev[s]=-1;const q=[s];
  for(let i=0;i<q.length;i++){const k=q[i];if(k===t)break;const x=k%COLS,y=(k/COLS)|0;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const nk=ny*COLS+nx;if(prev[nk]!==-2)continue;if(b[nk]&&nk!==t)continue;prev[nk]=k;q.push(nk)}}
  if(prev[t]===-2)return[{x:tx,y:ty}];
  const out=[];let k=t;while(k!==s&&k>=0){out.push({x:k%COLS,y:(k/COLS)|0});k=prev[k]}return out.reverse();
}
function routeTo(a,tx,ty){const pts=[];let sx=Math.round(a.x),sy=Math.round(a.y);if(a.y>8.4){if(Math.abs(a.x-DOOR.x)>.05)pts.push({x:DOOR.x,y:OUT_Y});pts.push({x:DOOR.x,y:DOOR.y});sx=DOOR.x;sy=DOOR.y}if(MAP.b[sy*COLS+sx]){sx=DOOR.x;sy=DOOR.y}a.path=pts.concat(bfsPath(sx,sy,tx,ty))}
function routeOut(a){routeTo(a,DOOR.x,DOOR.y);a.path.push({x:DOOR.x,y:OUT_Y},{x:a.exitX,y:OUT_Y})}
function stepAgent(a,dt,spd){let d=spd*dt;while(d>0&&a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,L=Math.hypot(dx,dy);if(L>.001){a.face=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);a.ang=Math.atan2(-dx,dy)}if(L<=d){a.x=p.x;a.y=p.y;a.path.shift();d-=L}else{a.x+=dx/L*d;a.y+=dy/L*d;d=0}}return a.path.length===0}

function envParts(){
  const p={base:20,floor:STYLES.floor[g.styles.floor].env,wall:STYLES.wall[g.styles.wall].env,noren:STYLES.noren[g.styles.noren].env,uniform:STYLES.uniform[g.styles.uniform].env,deco:0,tv:g.equip.tv?3:0,crowd:0};

function awareness(){const L=LOCS[g.loc];let s=0,w=0;for(const t of TYPES){s+=L.mix[t]*g.rep[t];w+=L.mix[t]}return s/w/5}
function promoNotice(){let n=g.sign?PROMOS.sign.notice:0;for(const p of g.promos)if(g.day>=p.from&&g.day<=p.until)n+=PROMOS[p.id].notice;return n}

function menuFit(t){const L=CT[t].likes,ls=listed();let s=0;for(const tag of L){const n=ls.filter(m=>m.tags.includes(tag)).length;s+=Math.min(n,3)/3}return s/L.length}
function estSpend(t){const ls=listed(),food=ls.filter(m=>!isDrink(m)),dr=ls.filter(m=>m.cat==='酒');if(!food.length)return 9999;const c=CT[t];const sc=m=>m.tags.filter(x=>c.likes.includes(x)).length;const fs=[...food].sort((a,b)=>sc(b)-sc(a)).slice(0,4);const fa=fs.reduce((s,m)=>s+priceOf(m.id),0)/fs.length;const da=dr.length?dr.reduce((s,m)=>s+priceOf(m.id),0)/dr.length:0;return fa*1.7+da*1.8*c.drink}
function enterProb(t,qlen){
  const c=CT[t];const parts={};
  parts.rep=(g.rep[t]-1.5)*.06;
  const r=estSpend(t)/c.pp;parts.price=r>1?-(r-1)*.7:(1-r)*.12;

  let worst='',wv=0;for(const k in parts)if(parts[k]<wv){wv=parts[k];worst=k}
  return{p,worst};
}

function planDay(){
  const d=dateOf(g.day),m=d.getMonth()+1,dd=d.getDate(),wd=d.getDay();
  const ev=[];let weather='晴';const r=Math.random();const winter=m===12||m<=2;
  if(r<.2)weather='雨';else if(winter&&r<.34)weather='寒流';
  if(m===12&&(dd===24||dd===25))ev.push({id:'xmas'});
  if(m===12&&dd===31)ev.push({id:'newyear'});
  if(m===2&&dd===14)ev.push({id:'valentine'});
  if(dd===5)ev.push({id:'payday'});
  if(g.inspectorDay===g.day)ev.push({id:'inspector',at:ri(18*60+20,21*60)});
  if(g.blogDay===g.day)ev.push({id:'blogger',at:ri(18*60+30,21*60)});
  const pool=[];
  if(g.loc==='songshan'&&(wd===5||wd===6||wd===0))pool.push(['concert',3]);
  pool.push(['jpholiday',1],['baseball',1.2],['hike',1],['inspection',1.2],['outage',.6]);
  if(g.day>3&&!g.blogDay)pool.push(['blogger',.8]);
  pool.push(['booking',winter?2.5:1]);
  if(g.day>1&&Math.random()<.5){const e=wpick(pool,x=>x[1]);if(e&&!ev.some(x=>x.id===e[0])){const id=e[0];const o={id};
    if(id==='inspection')o.at=ri(18*60,22*60);
    if(id==='outage')o.at=ri(18*60,21*60+30);
    if(id==='blogger')o.at=ri(18*60+30,21*60);
    if(id==='booking'){o.at=ri(18,20)*60+pick([0,30]);o.size=winter?pick([6,8,8]):pick([6,8])}
    if(id==='hike')g.hikeUntil=g.day+2;
    ev.push(o)}}
  g.today={weather,events:ev};
}

function trafficMul(t,min){
  const d=dateOf(g.day),wd=d.getDay();let m=[.75,.75,.85,.9,1,1.45,1.35][wd===0?0:wd];
  if(wd===0)m=.8;
  if(t==='office'&&(wd===0||wd===6))m*=.4;
  if(t==='friends'&&(wd===5||wd===6))m*=1.3;
  const w=g.today.weather;
  if(w==='雨')m*=['friends','couple','tourist'].includes(t)?.6:.8;
  if(w==='寒流')m*=.85;
  for(const e of g.today.events){
    if(e.id==='concert'&&min>=21*60&&(t==='friends'||t==='night'))m*=2.2;
    if(e.id==='jpholiday'){if(t==='tourist')m*=2.4;if(t==='biz')m*=1.3}
    if(e.id==='baseball'&&t==='office')m*=g.equip.tv?1.6:.75;
    if(e.id==='xmas'||e.id==='valentine'){if(t==='couple')m*=2.4}
    if(e.id==='newyear')m*=g.loc==='xinyi'?1.9:1.4;
  }
  return m;
}

const FACEV=[[0,-1],[1,0],[0,1],[-1,0]];
function partyExpr(p){
  if(p.angry||p.patience<25)return'angry';if(p.patience<55)return'sad';
  if(p.state==='leave')return(p.finalSat||0)>=75?'happy':'neutral';
  if(p.state==='dining'&&p.pending===0&&p.served.length)return Math.sin(frameT*.05+p.id)>.2?'eat':'laugh';
  if(p.state==='dining'&&p.pending>0)return'neutral';
  return'smile'}
function partyMembers(p){
  const seated=!!(p.seat&&['menu','waitOrder','dining'].includes(p.state)&&Math.abs(p.x-p.seat[0].access.x)<.05&&Math.abs(p.y-p.seat[0].access.y)<.05);
  const out=[];
  if(seated){
    if(p.seat[0].stool)p.seat.forEach((t,i)=>out.push({x:PX(t.cx),y:PY(t.cy)+6,dir:0,seated:true,L:p.looks[i]}));
    else{const t=p.seat[0];t.seats.slice(0,p.size).forEach((pt,i)=>{const dx=t.cx-pt.x,dy=t.cy-pt.y;let dir,yo;
      if(Math.abs(dy)>=Math.abs(dx)){dir=dy>0?2:0;yo=dy>0?18:4}else{dir=dx>0?1:3;yo=9}
      out.push({x:PX(pt.x),y:PY(pt.y)+yo,dir,seated:true,L:p.looks[i]})})}
  }else{const f=FACEV[p.face||0],qx=-f[1],qy=f[0],mv=p.path.length>0;
    for(let i=0;i<p.size;i++){const row=Math.floor(i/2),side=p.size===1?0:(i%2?.22:-.22);
      out.push({x:PX(p.x-f[0]*row*.42+qx*side),y:PY(p.y-f[1]*row*.42+qy*side)+10,dir:p.face||0,moving:mv,L:p.looks[i]})}}
  const ex=partyExpr(p);out.forEach((m,i)=>m.expr=(ex==='laugh'&&(p.id+i)%2)?'happy':(ex==='eat'&&(p.id+i)%3===1)?'happy':ex);
  return{seated,out};
}

function genApplicants(adId,role){
  const ad=ADS.find(a=>a.id===adId);const out=[];
  for(let i=0;i<4;i++){
    const pool=CHARS.filter(c=>c.role===role&&c.L<=g.lantern&&!g.staff.some(s=>s.key===c.key)&&!out.some(o=>o.key===c.key)&&!(g.usedChars[c.key]>g.day));
    const uniqP=adId==='hunter'?.65:adId==='web'?.4:.3;
    let s;
    if(pool.length&&Math.random()<uniqP){const c=pick(pool);const j=()=>ri(-4,4);s={key:c.key,name:c.name,role,st:{sk:c.st.sk+j(),sp:c.st.sp+j(),sv:c.st.sv+j(),en:c.st.en+j()},perk:c.perk,quote:c.q,story:c.story};
      const mainAvg=ROLES[role].main.reduce((a,k)=>a+s.st[k],0)/3;s.wage=Math.round((200+mainAvg*1.2)/5)*5}
    else{const r=ad.range;const st={};for(const k of['sk','sp','sv','en'])st[k]=ROLES[role].main.includes(k)?ri(r[0],r[1]):ri(15,40);
      s={key:null,name:pick(SURN)+pick(GIVEN),role,st,perk:'',quote:'',story:''};const mainAvg=ROLES[role].main.reduce((a,k)=>a+st[k],0)/3;s.wage=Math.round((185+mainAvg*1.1)/5)*5}
    s.id='a'+Math.random().toString(36).slice(2,8);s.hair=pick(['#1d1d1d','#3b2a1a','#5a3a22','#8a6a3a','#2a2a40']);
    out.push(s)}
  return out;
}

async function encodeSave(obj){const json=JSON.stringify(obj);
  try{const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return'IZK1:'+btoa(bin)}
  catch(e){return'IZK0:'+btoa(unescape(encodeURIComponent(json)))}}
async function decodeSave(code){code=code.replace(/\s+/g,'');
  if(code.startsWith('IZK1:')){const bin=atob(code.slice(5));const buf=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
  if(code.startsWith('IZK0:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
  throw new Error('bad')}

    if(kind==='wall'){if(spend(WALLDEC[k].cost)){g.wall[k]=(g.wall[k]||0)+1;toast(`掛上了${WALLDEC[k].label}`)}}
    if(kind==='equip'){if(spend(EQUIP[k].cost)){g.equip[k]=true;toast(`${EQUIP[k].label}安裝好了`)}}
    if(kind==='kitchen'){const i=+k;if(spend(KITCHEN[i].cost)){g.kitchen=i;toast(`升級成${KITCHEN[i].label}`)}}
    save();renderView();renderAll();return}
  if(d.style){const[grp,k]=d.style.split(':');const s=STYLES[grp][k];g.owned=g.owned||{};const owned=g.owned[grp+':'+k]||s.cost===0;if(!owned){if(!spend(s.cost))return;g.owned[grp+':'+k]=true}g.styles[grp]=k;toast(`換成${s.label}`);save();renderView();renderAll();return}
  if(d.promo){const k=d.promo,p=PROMOS[k];if(!spend(p.cost))return;if(k==='sign')g.sign=true;else{g.promos.push({id:k,from:g.day,until:g.day+p.days-1});if(k==='google')g.repBoostUntil=g.day+p.days-1;if(k==='blogger'){g.blogDay=g.day+1}}
    toast(`${p.label}：已安排`);save();renderView();renderAll();return}
  if(d.loan){const[i,a]=d.loan.split(':').map(Number);const plan=[{days:14,rate:.05},{days:60,rate:.12}][i];const l={amount:a,pay:a*(1+plan.rate)/plan.days,interest:a*plan.rate/plan.days,left:plan.days,days:plan.days};g.loans.push(l);g.cash+=a;attachLoan(l);toast(`借到 ${fmt(a)}`);save();renderView();renderAll();return}
  if(d.hours){const[k,v]=d.hours.split(':');const H={...(g.nextHours||g.hours)};H[k]=+v;if(H.close-H.open<5){toast('至少要營業 5 小時');return}if(rt)g.nextHours=H;else{g.hours=H;g.nextHours=null}save();renderView();renderAll();return}
  if(d.place){ui.placing=ui.placing===d.place?null:d.place;ui.sel=null;ui.placeRot=0;renderAll();return}
});
function attachLoan(l){l.principalLeft=function(){return this.amount*this.left/this.days}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!['title','new','brief','report','over','transfer'].includes(ui.view))closeView()});
$('#brand').addEventListener('click',()=>{if(g&&!rt){ui.pausedBefore=ui.paused;openView('rename')}});
function canvasTile(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*CW,y=(e.clientY-r.top)/r.height*CH;return{px:x,py:y,x:Math.floor((x-OX)/T),y:Math.floor((y-OY)/T),fx:(x-OX)/T-.5,fy:(y-OY)/T-.5}}
cv.addEventListener('mousemove',e=>{if(!ui.edit)return;const t=canvasTile(e);ui.hover=t.x>=0&&t.y>=0&&t.x<COLS&&t.y<ROWS?{x:t.x,y:t.y}:null});
cv.addEventListener('mouseleave',()=>ui.hover=null);
cv.addEventListener('click',e=>{
  const t=canvasTile(e);
  if(ui.edit){
    if(t.x<0||t.y<0||t.x>=COLS||t.y>=ROWS)return;
    if(ui.placing){const kind=ui.placing;const o={uid:g.nextUid,kind,x:t.x,y:t.y,rot:ui.placeRot||0};const v=validateLayout([...g.layout,o]);if(!v.ok){toast(v.msg);return}g.nextUid++;g.layout.push(o);g.storage[kind]--;if(!g.storage[kind])ui.placing=null;rebuildMap();renderAll();return}
    const hit=g.layout.find(o=>footprint(o).some(f=>f.x===t.x&&f.y===t.y));
    if(hit){ui.sel=ui.sel&&ui.sel.uid===hit.uid?null:hit;renderAll();return}
    if(ui.sel){const test=g.layout.map(o=>o.uid===ui.sel.uid?{...o,x:t.x,y:t.y}:o);const v=validateLayout(test);if(!v.ok){toast(v.msg);return}ui.sel.x=t.x;ui.sel.y=t.y;rebuildMap();renderAll()}
    return}
  if(rt){let best=null,bd=.8;for(const p of rt.parties){const d=Math.hypot(p.x-t.fx,p.y-t.fy);if(d<bd){bd=d;best=p}
      if(p.seat)for(const s of p.seat){const d2=Math.hypot(s.cx-t.fx,s.cy-t.fy);if(d2<bd){bd=d2;best=p}}}
    if(best){ui.pausedBefore=ui.paused;openView('party',best)}}
});
document.addEventListener('input',e=>{if(e.target.id==='impCode'){ui.impCode=e.target.value;if(ui.confirmImport){ui.confirmImport=false;ui.impMsg=''}return}const k=e.target.dataset&&e.target.dataset.vol;if(!k)return;AUD[k]=+e.target.value;if(MG)MG.gain.value=AUD.musicVol*.6;if(SG)SG.gain.value=AUD.sfxVol;saveAud()});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ownerPw'&&e.key==='Enter'){ACT.ownerLogin();return}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'&&ui.view&&!['title','new','brief','report','over','transfer'].includes(ui.view)){closeView();return}
  if(ui.view)return;
  if(e.key===' '&&rt){e.preventDefault();ui.paused=!ui.paused;renderBanner()}
  if(rt&&['1','2','4','8'].includes(e.key)){ui.speed=+e.key;ui.paused=false;renderBanner()}
  if((e.key==='r'||e.key==='R')&&ui.edit){if(ui.placing)ACT.rotPlace();else if(ui.sel)ACT.rotSel()}
});

// ================= 主迴圈 =================
function renderAll(){if(!g)return;renderTop();renderBanner();renderSide()}
let lastT=performance.now(),sideAcc=0;
const MIN_PER_SEC=1.0;
function loop(now){
  const dtr=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(g&&rt&&!ui.paused&&!ui.view){let dt=dtr*MIN_PER_SEC*ui.speed;while(dt>0&&rt){const s=Math.min(dt,.2);tick(s);dt-=s}}
  if(g){if(rt||ui.edit||true)draw();sideAcc+=dtr;if(sideAcc>.35&&rt){sideAcc=0;renderTop();if(ui.tab!=='log'||Math.random()<.5)renderSide()}}
  requestAnimationFrame(loop);
}
function boot(){
  sizeCanvas();window.addEventListener('resize',sizeCanvas);
  const s=load();
  if(s){g=s;for(const l of g.loans)attachLoan(l);rebuildMap();renderAll();openView('title')}
  else{newGame({name:'合',owner:'',loc:'songshan'},false);rebuildMap();renderAll();openView('title')}
  if(location.hash==='#admin'){ui.ownerMsg='';openView('owner')}
  window.addEventListener('hashchange',()=>{if(location.hash==='#admin'){ui.ownerMsg='';openView('owner')}});
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
